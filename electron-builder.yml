appId: de.leonstolz.scriptlab
productName: ScriptLab
copyright: Entwickelt von Leon Stolz
asar: true
allowMissingDependencies: false
directories:
  output: release
files:
  - dist/**/*
  - package.json
  - THIRD_PARTY_NOTICES.md
  - LICENSE.txt
extraResources:
  - from: LICENSE.txt
    to: LICENSE.txt
  - from: artifacts/python-buendel/python
    to: python
    filter:
      - '**/*'
  - from: laufzeit
    to: laufzeit
    filter:
      - '**/*.py'
      - '**/*.ttf'
      - '**/*.txt'
      - '**/*.md'
      - '*.lock'
      - '*.in'
      - '*.md'
      - '*.json'
  - from: artifacts/native/ScriptLab.Testhost.exe
    to: ScriptLab.Testhost.exe
  - from: scripts/signatur-helper.ps1
    to: signatur-helper.ps1
  - from: beispiele
    to: beispiele
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: README.md
    to: README.md
  - from: docs
    to: docs
    filter:
      - '**/*.md'
      - '**/*.png'
      - '**/*.gif'
      - '**/*.html'
      - '**/*.json'
win:
  icon: assets/scriptlab.ico
  target:
    - target: nsis
      arch:
        - x64
  requestedExecutionLevel: asInvoker
  verifyUpdateCodeSignature: true
  # Die gültigen PSF-Originalsignaturen und Manifest-Hashes der Python-EXEs bleiben erhalten.
  signExts:
    - '!python.exe'
    - '!pythonw.exe'
    - '!venvlauncher.exe'
    - '!venvwlauncher.exe'
    - '!normalizer.exe'
    - '!x86_64-w64-mingw32-nmakehlp.exe'
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
nsis:
  license: LICENSE.txt
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: false
  deleteAppDataOnUninstall: false
  installerLanguages:
    - de_DE
  language: 1031
  createDesktopShortcut: false
  createStartMenuShortcut: true
  shortcutName: ScriptLab
  artifactName: ScriptLab-${version}-Setup-x64.${ext}
publish:
  provider: github
  owner: siggismalz
  repo: ScriptLab
  private: false
  releaseType: release
electronUpdaterCompatibility: '>= 2.16'
