name: Windows pruefen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Festgelegte Python-Testlaufzeit bereitstellen
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
          architecture: x64
          update-environment: false
      - run: npm ci
      - run: npm run check
      - run: node scripts/laufzeit-host-bauen.mjs
      - run: npm test
        env:
          SCRIPTLAB_RUNTIME_TESTS: '1'
          SCRIPTLAB_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          SCRIPTLAB_TEST_PYTHON_VERSION: '3.15.2'
      - run: npm run build
      - run: npm run test:e2e
        env:
          SCRIPTLAB_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
          SCRIPTLAB_TEST_PYTHON_VERSION: '3.15.2'
      - name: Nicht veroeffentlichten Testinstaller bauen
        run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Paketinhalt und Updatepruefsummen vergleichen
        run: npm run verify:package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScriptLab-Windows-Testbuild
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/pruefung.json
          if-no-files-found: error
          retention-days: 14
      - name: Fehlernachweise sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ScriptLab-Prueffehler
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
